<style>
:root{--blue:#7ec8ff;--ink:#ffffff;--muted:rgba(255,255,255,.82);--line:rgba(255,255,255,.18);--bg:#004c73}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
.page{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.header{background:transparent;padding:16px 22px 10px;border-bottom:1px solid var(--line)}
h1{margin:0 0 5px;font-size:24px;line-height:1.25}
.subtitle{font-size:13px;color:var(--muted);line-height:1.5}
.controls{background:transparent;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 22px 14px;border-bottom:1px solid var(--line)}
.group{display:flex;align-items:center;gap:8px}.group label{font-weight:700;font-size:14px}
#yearSlider{width:min(340px,38vw)}
.year-value{min-width:48px;font-weight:800;color:var(--blue);font-size:16px}
select,button{height:36px;border:1px solid rgba(255,255,255,.32);border-radius:8px;background:rgba(255,255,255,.96);padding:0 11px;font-size:14px;color:#1f2937}
button{cursor:pointer}button:hover{background:#eef6fb}
.main{min-height:0;padding:12px}
.chart-card{height:100%;min-height:0;position:relative;background:#ffffff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden}
#chart{width:100%;height:100%;min-height:520px}
.modal-mask{position:absolute;inset:0;background:rgba(15,23,42,.18);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal-mask.show{display:flex}
.modal{width:min(420px,90vw);background:#fff;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.22);padding:20px;position:relative}
.modal h2{margin:0 0 14px;font-size:21px}.close{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:24px;height:auto;padding:0 5px;color:#64748b}
.details{display:grid;grid-template-columns:110px 1fr;gap:11px 14px;font-size:15px}.details .k{color:#64748b}.details .v{font-weight:700}
.badge{display:inline-block;color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800}
@media(max-width:780px){html,body{overflow:auto}.page{height:auto;min-height:100%}.controls{align-items:flex-start}.main{height:720px}#yearSlider{width:230px}h1{font-size:20px}}
</style>
</head>
