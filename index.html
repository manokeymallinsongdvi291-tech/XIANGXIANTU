<!doctype html>
<html lang="zh-CN">
<head>

<title>2000—2024年长期平均值前10省份鱼类废弃物年度变化</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<style>
  :root{
    --story-blue:#213e5a;
    --text:#ffffff;
    --axis:rgba(255,255,255,.88);
    --muted:rgba(255,255,255,.78);
  }
  *{box-sizing:border-box;}
  html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--story-blue);
    color:var(--text);
    font-family:Arial,"Microsoft YaHei",sans-serif;
  }
  .wrap{
    width:100%;
    height:100%;
    min-height:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:var(--story-blue);
  }
  .header{
    flex:0 0 auto;
    padding:12px 18px 0;
    text-align:center;
  }
  h1{
    margin:0;
    color:var(--text);
    font-size:clamp(16px,2.15vw,24px);
    line-height:1.25;
    font-weight:600;
  }
  .unit{
    margin:5px 0 0;
    color:var(--muted);
    font-size:clamp(12px,1.35vw,15px);
  }
  #chart{
    flex:1 1 auto;
    width:100%;
    min-height:0;
    overflow:hidden;
  }
</style>
</head>

    formatter:function(params){

      return `<div style="font-weight:700;margin-bottom:4px">${params[0].axisValue}年</div>${rows}<div style="margin-top:5px;color:rgba(255,255,255,.75)">单位：万吨</div>`;

    nameTextStyle:{color:'#fff',fontSize:13},
    axisLine:{show:true,lineStyle:{color:axisColor,width:1}},

    axisLabel:{color:'#fff',fontSize:11,margin:10},
    splitLine:{show:false},
    minorSplitLine:{show:false}
  },
  series
});

function resizeChart(){
  chart.resize({width:chartEl.clientWidth,height:chartEl.clientHeight});
}
window.addEventListener('resize', resizeChart, {passive:true});
if ('ResizeObserver' in window){
  new ResizeObserver(resizeChart).observe(chartEl);
}
requestAnimationFrame(resizeChart);
</script>
</body>
</html>
