  select { padding: 6px 10px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; }

  .v { font-weight:600; color:#111827; }

const chart = echarts.init(document.getElementById('chart'));
const yearSlider = document.getElementById('yearSlider');
const yearSelect = document.getElementById('yearSelect');
const yearValue = document.getElementById('yearValue');
const playBtn = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');
const highlightBtn = document.getElementById('highlightBtn');
const showAllBtn = document.getElementById('showAllBtn');
let playTimer = null;
let onlyHighHigh = false;

function fmt(num, digits=2) {
  return Number(num).toLocaleString('zh-CN', {minimumFractionDigits: digits, maximumFractionDigits: digits});
}
function quadrantName(x, y, mx, my) {
  if (x >= mx && y >= my) return '高总量高人均';
  if (x < mx && y >= my) return '低总量高人均';
  if (x >= mx && y < my) return '高总量低人均';
  return '低总量低人均';
}
function quadrantColor(q) {
  if (q === '高总量高人均') return '#d7263d';
  if (q === '低总量高人均') return '#6f42c1';
  if (q === '高总量低人均') return '#ff8c00';
  return '#2a9d8f';
}
function updateInfo(name, year) {
  document.getElementById('infoYear').textContent = year;
  const rows = DATA[year];
  const row = rows.find(d => d.name === name);
  if (!row) return;
  const mx = MEANS[year].x, my = MEANS[year].y;
  const q = quadrantName(row.value[0], row.value[1], mx, my);
  document.getElementById('infoProvince').textContent = row.name;
  document.getElementById('infoTotal').textContent = fmt(row.value[0], 2) + ' 万吨';
  document.getElementById('infoPerCapita').textContent = fmt(row.value[1], 2) + ' 千克';
  const el = document.getElementById('infoQuadrant');
  el.textContent = q;
  el.style.background = quadrantColor(q);
  document.getElementById('infoThreshold').textContent = '平均总量 ' + fmt(mx, 2) + ' 万吨；平均人均 ' + fmt(my, 2) + ' 千克';
}
function makeSeries(year) {
  let rows = DATA[year].map(d => ({...d}));
  const mx = MEANS[year].x, my = MEANS[year].y;
  if (onlyHighHigh) {
    rows = rows.filter(d => quadrantName(d.value[0], d.value[1], mx, my) === '高总量高人均');
  }
  return rows.map(d => {
    const q = quadrantName(d.value[0], d.value[1], mx, my);
    return {
      name: d.name,
      type: 'scatter',
      data: [{
        name: d.name,
        value: d.value,
        meta: d.meta,
        quadrant: q
      }],
      symbol: d.symbol,
      symbolSize: 15,
      itemStyle: { color: d.itemStyle.color, borderColor: '#ffffff', borderWidth: 1.2 },
      emphasis: { scale: 1.35, focus: 'series', itemStyle: { shadowBlur: 18, shadowColor: 'rgba(0,0,0,0.20)' } },
      tooltip: {
        formatter: function(params) {
          const m = params.data.meta;
          return '<b>' + m.province + '</b><br/>' +
                 '年份：' + year + '<br/>' +
                 '总水产废弃物：' + fmt(m.total_waste_wt, 2) + ' 万吨<br/>' +
                 '人均水产废弃物：' + fmt(m.per_capita_kg, 2) + ' 千克<br/>' +
                 '象限：' + params.data.quadrant;
        }
      }
    };
  });
}
function buildOption(year) {
  const rows = DATA[year];
  const mx = MEANS[year].x, my = MEANS[year].y;
  const r = RANGES[year];
  const xPad = (r.xmax - r.xmin) * 0.15 || 1;
  const yPad = (r.ymax - r.ymin) * 0.18 || 1;
  return {
    animationDuration: 500,
    color: rows.map(d => d.itemStyle.color),
    title: {
      text: year + '年各省四象限分布',
      subtext: '点击散点可查看省份信息',
      left: 'center',
      top: 10,
      textStyle: { fontSize: 20, fontWeight: 700 },
      subtextStyle: { color:'#6b7280', fontSize: 12 }
    },
    legend: {
      type: 'scroll',
      orient: 'vertical',
      right: 10,
      top: 70,
      bottom: 100,
      pageIconColor: '#0f62fe',
      pageTextStyle: { color:'#374151' },
      textStyle: { fontSize: 12 },
      tooltip: { show: true },
      data: rows.map(d => d.name)
    },
    grid: { left: 70, right: 170, top: 80, bottom: 80 },
    tooltip: { trigger: 'item', enterable: true },
    toolbox: {
      feature: {
        dataZoom: {},
        restore: {},
        saveAsImage: { pixelRatio: 2, name: '水产废弃物四象限图_' + year }
      },
      right: 14,
      top: 18
    },
    xAxis: {
      name: '总水产废弃物（万吨）',
      nameLocation: 'middle',
      nameGap: 32,
      min: Math.max(0, r.xmin - xPad),
      max: r.xmax + xPad,
      splitLine: { show:true, lineStyle: { color:'#eef2f7' } },
      axisLine: { lineStyle: { color:'#6b7280' } },
      axisLabel: { color:'#374151' }
    },
    yAxis: {
      name: '人均水产废弃物（千克）',
      nameLocation: 'middle',
      nameGap: 50,
      min: Math.max(0, r.ymin - yPad),
      max: r.ymax + yPad,
      splitLine: { show:true, lineStyle: { color:'#eef2f7' } },
      axisLine: { lineStyle: { color:'#6b7280' } },
      axisLabel: { color:'#374151' }
    },
    dataZoom: [
      { type: 'inside', xAxisIndex: 0, filterMode: 'none' },
      { type: 'inside', yAxisIndex: 0, filterMode: 'none' },
      { type: 'slider', xAxisIndex: 0, bottom: 20 },
      { type: 'slider', yAxisIndex: 0, right: 150 }
    ],
    graphic: [
      { type:'text', left:'15%', top:'17%', style:{ text:'低总量\n高人均', fill:'#6f42c1', font:'bold 18px Arial', textAlign:'center' } },
      { type:'text', right:'22%', top:'17%', style:{ text:'高总量\n高人均', fill:'#d7263d', font:'bold 18px Arial', textAlign:'center' } },
      { type:'text', left:'15%', bottom:'18%', style:{ text:'低总量\n低人均', fill:'#2a9d8f', font:'bold 18px Arial', textAlign:'center' } },
      { type:'text', right:'22%', bottom:'18%', style:{ text:'高总量\n低人均', fill:'#ff8c00', font:'bold 18px Arial', textAlign:'center' } }
    ],
    series: makeSeries(year).concat([
      {
        name: '均值参考',
        type: 'scatter',
        data: [],
        markLine: {
          silent: true,
          symbol: 'none',
          label: { formatter: function(obj) { return obj.name; }, color:'#4b5563' },
          lineStyle: { color:'#4b5563', type:'dashed', width:1.6 },
          data: [
            { xAxis: mx, name: '平均总量 = ' + fmt(mx, 2) },
            { yAxis: my, name: '平均人均 = ' + fmt(my, 2) }
          ]
        }
      }
    ])
  };
}
function setYear(year) {
  yearValue.textContent = year;
  yearSelect.value = year;
  yearSlider.value = YEARS.indexOf(year);
  chart.setOption(buildOption(year), true);
  document.getElementById('infoYear').textContent = year;
}
setYear('2024');
updateInfo(DATA['2024'][0].name, '2024');

yearSlider.addEventListener('input', e => setYear(YEARS[Number(e.target.value)]));
yearSelect.addEventListener('change', e => setYear(e.target.value));
playBtn.addEventListener('click', () => {
  if (playTimer) {
    clearInterval(playTimer); playTimer = null; playBtn.textContent = '▶ 播放'; return;
  }
  playBtn.textContent = '⏸ 暂停';
  playTimer = setInterval(() => {
    let idx = Number(yearSlider.value);
    idx = (idx + 1) % YEARS.length;
    setYear(YEARS[idx]);
  }, 1200);
});
resetBtn.addEventListener('click', () => chart.dispatchAction({type:'restore'}));
highlightBtn.addEventListener('click', () => { onlyHighHigh = true; setYear(yearValue.textContent); });
showAllBtn.addEventListener('click', () => { onlyHighHigh = false; setYear(yearValue.textContent); });
chart.on('click', params => { if (params.data && params.data.meta) updateInfo(params.data.meta.province, yearValue.textContent); });
window.addEventListener('resize', () => chart.resize());
</script>
